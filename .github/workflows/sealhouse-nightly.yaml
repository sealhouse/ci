# The alpha head on every cluster, the soak, vulnerability scans and rebuilds.
# The scans and the MicroShift watch run every night; the rest only when their inputs changed
# since their last green run, or that run is a week old. A dispatch runs everything.
name: sealhouse-nightly

on:
  schedule:
    - cron: '40 8 * * *'
  workflow_dispatch:

permissions: {}

concurrency: sealhouse-nightly

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      e2e: ${{ steps.plan.outputs.e2e }}
      rebuild: ${{ steps.plan.outputs.rebuild }}
      next: ${{ steps.plan.outputs.next }}
    env:
      FORKS: cosign fulcio rekor-tiles timestamp-authority
    steps:
      - name: Scripts
        run: |
          git clone -q "https://github.com/${GITHUB_REPOSITORY}.git" ci
          git -C ci checkout -q --detach "${GITHUB_SHA}"
          ci/hack/install-go.sh
      - name: Toolchain
        run: ci/hack/tools.sh crane
      - name: Inputs
        run: |
          if git -C ci fetch -q origin nightly-state; then
            git -C ci show FETCH_HEAD:nightly-state.env >state
          else
            : >state
          fi
          git clone -q --depth 1 https://github.com/sealhouse/pqc-catalog.git pqc-catalog
          for fork in ${FORKS}; do
            git clone -q --filter=blob:none -b rhtas/main "https://github.com/sealhouse/${fork}.git" "${fork}"
            last="$(REGISTRY_HOST=ghcr.io ci/hack/last-image.sh "${fork}" HEAD rhtas/main)"
            echo "${fork} ${last:-none none}" >>images
          done
      - name: Plan
        id: plan
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          ci/hack/nightly-state.sh plan ci state pqc-catalog/alpha/head.env images next 2> >(tee -a "${GITHUB_STEP_SUMMARY}" >&2) >>"${GITHUB_OUTPUT}"
          echo "next=$(base64 -w0 next)" >>"${GITHUB_OUTPUT}"

  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scripts
        run: |
          git clone -q "https://github.com/${GITHUB_REPOSITORY}.git" ci
          git -C ci checkout -q --detach "${GITHUB_SHA}"
          ci/hack/install-go.sh
      - name: Toolchain
        run: ci/hack/tools.sh
      - name: MicroShift
        run: ci/hack/watch-microshift.sh

  kind:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ['1.33', '1.34', '1.35']
    env:
      KIND_VERSION: ${{ matrix.version }}
    steps:
      - name: Scripts
        run: |
          git clone -q "https://github.com/${GITHUB_REPOSITORY}.git" ci
          git -C ci checkout -q --detach "${GITHUB_SHA}"
          ci/hack/install-go.sh
      - name: Toolchain
        run: ci/hack/tools.sh
      - name: Alpha head
        run: |
          git clone -q https://github.com/sealhouse/pqc-catalog.git pqc-catalog
          echo "CATALOG_REPO=${PWD}/pqc-catalog" >>"${GITHUB_ENV}"
          echo "OPERATOR_REPO=https://github.com/sealhouse/secure-sign-pqc-operator.git" >>"${GITHUB_ENV}"
      - name: Cluster
        run: |
          ci/hack/cluster-up.sh
          echo "E2E_KUBECONFIG=${PWD}/ci/.state/sealhouse-${KIND_VERSION//./-}.kubeconfig" >>"${GITHUB_ENV}"
      - name: UIDs
        run: KUBECONFIG="${E2E_KUBECONFIG}" KUBE_CONTEXT="kind-sealhouse-${KIND_VERSION//./-}" ci/hack/test-arbitrary-uid.sh
      - name: E2E
        run: ci/hack/e2e-alpha.sh "${E2E_KUBECONFIG}" "kind-sealhouse-${KIND_VERSION//./-}" "${PWD}/e2e"
      - name: Cluster state
        if: failure()
        run: |
          KUBECONFIG="${E2E_KUBECONFIG}" kubectl get pods -A -o wide
          KUBECONFIG="${E2E_KUBECONFIG}" kubectl get events -A --sort-by=.lastTimestamp | tail -50

  microshift:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ['4.20', '4.21', '4.22']
    env:
      MICROSHIFT_VERSION: ${{ matrix.version }}
    steps:
      - name: Scripts
        run: |
          git clone -q "https://github.com/${GITHUB_REPOSITORY}.git" ci
          git -C ci checkout -q --detach "${GITHUB_SHA}"
          ci/hack/install-go.sh
      - name: Toolchain
        run: ci/hack/tools.sh
      - name: Alpha head
        run: |
          git clone -q https://github.com/sealhouse/pqc-catalog.git pqc-catalog
          echo "CATALOG_REPO=${PWD}/pqc-catalog" >>"${GITHUB_ENV}"
          echo "OPERATOR_REPO=https://github.com/sealhouse/secure-sign-pqc-operator.git" >>"${GITHUB_ENV}"
      - name: Cluster
        run: |
          ci/hack/microshift-up.sh
          echo "E2E_KUBECONFIG=${PWD}/ci/.state/microshift.kubeconfig" >>"${GITHUB_ENV}"
      - name: E2E
        run: ci/hack/e2e-alpha.sh "${E2E_KUBECONFIG}" microshift-sealhouse "${PWD}/e2e"
      - name: Cluster state
        if: failure()
        run: |
          KUBECONFIG="${E2E_KUBECONFIG}" kubectl get pods -A -o wide
          KUBECONFIG="${E2E_KUBECONFIG}" kubectl get events -A --sort-by=.lastTimestamp | tail -50

  soak:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: write
    steps:
      - name: Scripts
        run: |
          git clone -q "https://github.com/${GITHUB_REPOSITORY}.git" ci
          git -C ci checkout -q --detach "${GITHUB_SHA}"
          ci/hack/install-go.sh
      - name: Toolchain
        run: ci/hack/tools.sh
      - name: Alpha head
        run: |
          git clone -q https://github.com/sealhouse/pqc-catalog.git pqc-catalog
          echo "CATALOG_REPO=${PWD}/pqc-catalog" >>"${GITHUB_ENV}"
          echo "OPERATOR_REPO=https://github.com/sealhouse/secure-sign-pqc-operator.git" >>"${GITHUB_ENV}"
      - name: Trend
        run: |
          if git -C ci fetch -q origin soak-trend; then
            git -C ci show FETCH_HEAD:soak-trend.tsv >soak-trend.tsv || true
          fi
      - name: Soak
        run: ci/hack/soak.sh "${PWD}/e2e" "${PWD}/soak" "${PWD}/soak-trend.tsv"
      - name: Record
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ ! -s soak-trend.tsv ] || ci/hack/soak-record.sh soak-trend.tsv

  vulns:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Scripts
        run: |
          git clone -q "https://github.com/${GITHUB_REPOSITORY}.git" ci
          git -C ci checkout -q --detach "${GITHUB_SHA}"
          ci/hack/install-go.sh
      - name: Toolchain
        run: ci/hack/tools.sh
      - name: Scan
        run: |
          failed=0
          while read -r repo ref; do
            echo "== ${repo}"
            git clone -q --depth 1 -b "${ref}" "https://github.com/sealhouse/${repo}.git" "tree-${repo}"
            if ci/hack/vulncheck.sh "tree-${repo}" "out/${repo}"; then
              grep -E '^(fix available|no fix yet)' "out/${repo}/summary" >>"${GITHUB_STEP_SUMMARY}" || true
            else
              failed=1
            fi
          done < <(awk '!/^#/ { print $1, "rhtas/main" }' ci/forks.lock; echo secure-sign-pqc-operator main)
          exit "${failed}"

  rebuild:
    needs: changes
    if: needs.changes.outputs.rebuild != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fork: ${{ fromJSON(needs.changes.outputs.rebuild) }}
    steps:
      - name: Scripts
        run: |
          git clone -q "https://github.com/${GITHUB_REPOSITORY}.git" ci
          git -C ci checkout -q --detach "${GITHUB_SHA}"
          ci/hack/install-go.sh
      - name: Toolchain
        run: ci/hack/tools.sh
      - name: Registry
        run: |
          image="$(grep '^REGISTRY=' ci/images.lock | cut -d= -f2-)"
          docker run -d --rm -p 127.0.0.1:5002:5000 --name rebuild-registry "${image}"
      - name: Rebuild
        env:
          FORK: ${{ matrix.fork }}
          REBUILD_REGISTRY: localhost:5002
        run: |
          git clone -q --filter=blob:none -b rhtas/main "https://github.com/sealhouse/${FORK}.git" "${FORK}"
          ci/hack/rebuild-check.sh "${PWD}/${FORK}" ghcr.io

  # The jobs that passed become the baseline the next night compares against.
  record:
    needs: [changes, kind, microshift, soak, rebuild]
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Scripts
        run: |
          git clone -q "https://github.com/${GITHUB_REPOSITORY}.git" ci
          git -C ci checkout -q --detach "${GITHUB_SHA}"
      - name: Record
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ needs.changes.outputs.next }}
          E2E: ${{ needs.kind.result == 'success' && needs.microshift.result == 'success' && needs.soak.result == 'success' }}
          REBUILD: ${{ needs.rebuild.result == 'success' && needs.changes.outputs.rebuild || '[]' }}
        run: |
          if git -C ci fetch -q origin nightly-state; then
            git -C ci show FETCH_HEAD:nightly-state.env >state
          else
            : >state
          fi
          base64 -d <<<"${NEXT}" >next
          keys=()
          [ "${E2E}" != true ] || keys+=(e2e)
          while read -r fork; do keys+=("rebuild/${fork}"); done < <(jq -r '.[]' <<<"${REBUILD}")
          if [ "${#keys[@]}" -eq 0 ]; then
            echo "nothing new passed"
            exit 0
          fi
          ci/hack/nightly-state.sh record state next "${keys[@]}"
