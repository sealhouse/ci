# Moves every caller to the ci commit just merged.
name: sealhouse-repin

on:
  push:
    branches: [main]
    paths-ignore:
      - test/**
      - .github/workflows/sealhouse-*.yaml
      - forks.lock
      - replaces.lock
      - README.md
      # Run only by ci's own workflows; test/test-repin-paths.sh keeps the callers off them.
      - hack/bot-merge.sh
      - hack/bump-pr.sh
      - hack/bump-update.sh
      - hack/e2e-alpha.sh
      - hack/microshift-up.sh
      - hack/rebuild-check.sh
      - hack/record-catalog.sh
      - hack/release-library.sh
      - hack/repin.sh
      - hack/replace-consumers.sh
      - hack/replace-lib.sh
      - hack/soak-record.sh
      - hack/soak.sh
      - hack/status.sh
      - hack/sync-finish.sh
      - hack/sync-fork.sh
      - hack/watch-microshift.sh
  workflow_dispatch:

permissions: {}

concurrency: sealhouse-repin

jobs:
  repin:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scripts
        run: |
          git clone -q "https://github.com/${GITHUB_REPOSITORY}.git" ci
          git -C ci checkout -q --detach "${GITHUB_SHA}"
      - name: Pin
        env:
          BOT_APP_ID: ${{ secrets.SEALHOUSE_BOT_APP_ID }}
          BOT_APP_KEY: ${{ secrets.SEALHOUSE_BOT_APP_KEY }}
        run: ci/hack/repin.sh "${GITHUB_SHA}"
