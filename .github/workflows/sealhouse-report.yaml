# Collects today's report, and yesterday's until it is final, and commits them with the rollup to sealhouse/reports.
# The timer starts it every hour. A failed collection is recorded too, so a missing day always means the report did not run.
name: sealhouse-report
run-name: ${{ inputs.timer }}

on:
  workflow_dispatch:
    inputs:
      date:
        description: the UTC day to report, YYYY-MM-DD; today, and yesterday until it is final, when empty
        required: false
        default: ''
      timer:
        description: set by sealhouse-timer, which names the run after it
        default: ''

permissions: {}

concurrency: sealhouse-report

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DAY: ${{ inputs.date }}
      REPORT_RUN_ID: ${{ github.run_id }}
      REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPORT_CI: ${{ github.sha }}
    steps:
      - name: Scripts
        run: |
          set -euo pipefail
          ci="${SEALHOUSE_CI:-}"
          if [ -z "${ci}" ]; then
            ci="${RUNNER_TEMP}/ci"
            git clone -q "https://github.com/${GITHUB_REPOSITORY}.git" "${ci}"
            git -C "${ci}" checkout -q --detach "${GITHUB_SHA}"
          fi
          echo "CI_DIR=${ci}" >>"${GITHUB_ENV}"
          [ -z "${DAY}" ] || [[ "${DAY}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad date '${DAY}'" >&2; exit 1; }
      - name: Go
        run: '"${CI_DIR}/hack/install-go.sh"'
      - name: Toolchain
        run: '"${CI_DIR}/hack/tools.sh" crane'
      - name: Report
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_APP_ID: ${{ secrets.SEALHOUSE_BOT_APP_ID }}
          BOT_APP_KEY: ${{ secrets.SEALHOUSE_BOT_APP_KEY }}
        run: '"${CI_DIR}/hack/report-run.sh" ${DAY:+"${DAY}"}'
      # report-run.sh records its own failures; this records one that stopped the run before it.
      - name: Record the failure
        if: failure() && steps.report.outcome == 'skipped'
        env:
          BOT_APP_ID: ${{ secrets.SEALHOUSE_BOT_APP_ID }}
          BOT_APP_KEY: ${{ secrets.SEALHOUSE_BOT_APP_KEY }}
        run: '[ -z "${CI_DIR:-}" ] || "${CI_DIR}/hack/report-publish.sh" "${DAY:-$(date -u +%F)}" --failed'
