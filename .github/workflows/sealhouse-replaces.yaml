# Releases fork libraries into replaces.lock and takes the consumers to the new lines.
name: sealhouse-replaces
run-name: ${{ inputs.timer }}

on:
  push:
    branches: [main]
    paths: [replaces.lock]
  workflow_dispatch:
    inputs:
      fork:
        description: the fork to release a library from; needed unless the timer starts the run
        default: ''
      subdir:
        default: .
      reason:
        default: ''
      drop-when:
        description: upstream>=vX.Y.Z
        default: ''
      timer:
        description: set by sealhouse-timer, which names the run after it
        default: ''

permissions: {}

concurrency:
  group: sealhouse-replaces
  cancel-in-progress: false

jobs:
  replaces:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BOT_APP_ID: ${{ secrets.SEALHOUSE_BOT_APP_ID }}
      BOT_APP_KEY: ${{ secrets.SEALHOUSE_BOT_APP_KEY }}
      SYNC_APP_ID: ${{ secrets.SEALHOUSE_SYNC_APP_ID }}
      SYNC_APP_KEY: ${{ secrets.SEALHOUSE_SYNC_APP_KEY }}
    steps:
      - name: Scripts
        run: |
          git clone -q "https://github.com/${GITHUB_REPOSITORY}.git" ci
          git -C ci checkout -q --detach "${GITHUB_SHA}"
          ci/hack/install-go.sh
      - name: Release
        if: github.event_name == 'workflow_dispatch' && !inputs.timer
        env:
          FORK: ${{ inputs.fork }}
          SUBDIR: ${{ inputs.subdir }}
          REASON: ${{ inputs.reason }}
          DROP_WHEN: ${{ inputs.drop-when }}
        run: |
          [ -n "${FORK}" ] && [ -n "${REASON}" ] && [ -n "${DROP_WHEN}" ] || { echo "a release needs fork, reason and drop-when" >&2; exit 1; }
          ci/hack/release-library.sh "${FORK}" "${SUBDIR}" "${REASON}" "${DROP_WHEN}"
      - name: Release what changed
        if: ${{ inputs.timer }}
        run: ci/hack/release-library.sh --auto
      - name: Consumers
        if: github.event_name != 'workflow_dispatch' || inputs.timer
        run: ci/hack/replace-consumers.sh
      - name: Removable
        if: ${{ inputs.timer }}
        run: ci/hack/release-library.sh --removable | tee -a "${GITHUB_STEP_SUMMARY}"
